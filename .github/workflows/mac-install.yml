name: Sonat macOS installer
on:
  push:
    branches: [main]
    paths:
      - 'Установить Sonat.command'
      - '.github/workflows/mac-install.yml'
permissions:
  contents: read
jobs:
  install:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install using the downloaded distribution
        run: './Установить\ Sonat.command --no-open'
      - name: Verify installed app and open the recording window
        shell: bash
        run: |
          set -euo pipefail
          bundle="$HOME/Applications/Sonat.app"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$bundle/Contents/Info.plist")" = com.stepancyberpsy.sonat
          profile="$(mktemp -d)"
          "$bundle/Contents/MacOS/Electron" --user-data-dir="$profile" --remote-debugging-address=127.0.0.1 --remote-debugging-port=0 > "$RUNNER_TEMP/sonat.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            if [[ -s "$profile/DevToolsActivePort" ]]; then
              port="$(head -1 "$profile/DevToolsActivePort")"
              if curl -fsS "http://127.0.0.1:$port/json/list" | jq -e 'any(.[]; .url == "sonat://studio/index.html" and .title == "Sonat")' >/dev/null; then exit 0; fi
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/sonat.log"
          exit 1
