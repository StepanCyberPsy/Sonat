name: Sonat release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonat-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      version: ${{ steps.version.outputs.version }}
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - id: version
        run: node -e 'const v=require("./package.json").version;if(!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(v))throw Error("Invalid version");require("fs").appendFileSync(process.env.GITHUB_OUTPUT,`version=${v}\n`)'
      - id: release
        uses: actions/github-script@v7
        env:
          SONAT_VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') throw new Error('Releases require main');
            const tag = `v${process.env.SONAT_VERSION}`;
            try {
              const {data} = await github.rest.repos.getReleaseByTag({...context.repo, tag});
              if (!data.draft) {
                core.setOutput('created', 'false');
                core.notice('Published release already exists; no changes made.');
                return;
              }
              if (data.target_commitish !== context.sha) throw new Error('Draft belongs to another commit');
              core.setOutput('created', 'true');
              core.setOutput('id', String(data.id));
              return;
            } catch (e) { if (e.status !== 404) throw e; }
            // Do not reuse an existing tag: its source may differ from this checked commit.
            try {
              const {data} = await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
              if (data.object.sha !== context.sha) throw new Error(`Tag ${tag} points to another commit`);
            } catch (e) { if (e.status !== 404) throw e; }
            core.setOutput('created', 'true');
  build:
    needs: prepare
    if: needs.prepare.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Build and verify the installed app
        run: |
          SONAT_BUILD_FROM_SOURCE=1 './Установить Sonat.command' --no-open
          node scripts/smoke-call-probe.cjs "$HOME/Applications/Sonat.app"
          node scripts/package-release.cjs
      - name: Install the release ZIP without a compiler and reject corrupt downloads
        run: node scripts/macos-release-install.cjs
      - name: Test real archive, atomic app replacement and launch
        run: SONAT_TEST_REAL_UPDATE=1 node test/macos-updates.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: sonat-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sonat-*
          path: dist
          merge-multiple: true
      - uses: actions/github-script@v7
        env:
          SONAT_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            let release;
            try {
              ({data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag: `v${process.env.SONAT_VERSION}`}));
              if (!release.draft) { core.notice('Published release already exists; no changes made.'); return; }
            } catch (e) {
              if (e.status !== 404) throw e;
              ({data: release} = await github.rest.repos.createRelease({...context.repo, tag_name: `v${process.env.SONAT_VERSION}`, target_commitish: context.sha, name: `Sonat ${process.env.SONAT_VERSION}`, draft: true, prerelease: false, body: 'Сборки Sonat для Apple Silicon и Intel. Обновление сохраняет настройки и предыдущую версию.'}));
            }
            const release_id = release.id;
            if (!release.draft || release.tag_name !== `v${process.env.SONAT_VERSION}` || release.target_commitish !== context.sha) throw new Error('Release changed during build');
            if (release.assets.some(a => !['arm64', 'x64'].some(arch => a.name === `Sonat-${process.env.SONAT_VERSION}-darwin-${arch}.zip`))) throw new Error('Draft contains unknown assets');
            for (const arch of ['arm64', 'x64']) {
              const name = `Sonat-${process.env.SONAT_VERSION}-darwin-${arch}.zip`;
              const data = fs.readFileSync(`dist/${name}`);
              const digest = `sha256:${crypto.createHash('sha256').update(data).digest('hex')}`;
              let asset = release.assets.find(a => a.name === name);
              if (asset && (asset.digest !== digest || asset.size !== data.length)) {
                const {data: latest} = await github.rest.repos.getRelease({...context.repo, release_id});
                if (!latest.draft || latest.target_commitish !== context.sha) throw new Error('Draft changed during retry');
                await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id: asset.id});
                asset = null;
              }
              if (!asset) ({data: asset} = await github.rest.repos.uploadReleaseAsset({...context.repo, release_id, name, data, headers: {'content-type': 'application/zip', 'content-length': data.length}}));
              if (asset.digest !== digest || asset.size !== data.length) throw new Error('GitHub asset checksum mismatch');
            }
            await github.rest.repos.updateRelease({...context.repo, release_id, draft: false, make_latest: 'true'});
